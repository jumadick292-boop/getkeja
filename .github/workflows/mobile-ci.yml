name: Mobile CI

on:
  push:
    branches:
      - main
    paths:
      - "Mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Mobile/**"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze, test and build Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test with coverage
        run: flutter test --coverage

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: get-keja-debug-apk
          path: Mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: get-keja-mobile-coverage
          path: Mobile/coverage/lcov.info
          retention-days: 14
