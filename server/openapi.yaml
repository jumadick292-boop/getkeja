  /api/v1/messaging/conversations/{conversationId}/messages:
    get:
      summary: List messages in an authorized conversation
      tags: [Messaging]
      security: [{ bearerAuth: [] }]
      parameters:
      - in: path
        name: conversationId
        required: true
        schema: { type: string, format: uuid }
      - in: query
        name: limit
        schema: { type: integer }
      responses:
        '200': { description: Messages }
        '403': { description: Not a participant }
    post:
      summary: Send a message in an authorized conversation
      tags: [Messaging]
      security: [{ bearerAuth: [] }]
      parameters:
      - in: path
        name: conversationId
        required: true
        schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        '201': { description: Message sent }
        '403': { description: Not a participant }
