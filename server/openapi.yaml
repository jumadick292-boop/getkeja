  /api/v1/messaging/conversations:
    get:
      summary: List the authenticated user's conversations
      tags: [Messaging]
      security: [{ bearerAuth: [] }]
      parameters:
      - in: query
        name: type
        schema: { type: string }
      - in: query
        name: limit
        schema: { type: integer }
      - in: query
        name: offset
        schema: { type: integer }
      responses:
        '200': { description: Conversations }
    post:
      summary: Start or reuse an authorized contextual conversation
      description: >
        Exactly one business context id is required. The backend derives the
        authorized participant set, enforces access, and reuses an existing
        active conversation for the same context (dedup). conversation.type is
        one of enquiry, site_visit, rental_application, rental_proposal, tenancy,
        maintenance, garbage_service, moving_job, marketplace_request,
        garbage_job, laundry_order, scheduling_activity, general.
      tags: [Messaging]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string }
                subject: { type: string }
                movingJobId: { type: string, format: uuid }
                marketplaceRequestId: { type: string, format: uuid }
                garbageJobId: { type: string, format: uuid }
                laundryOrderId: { type: string, format: uuid }
                schedulingActivityId: { type: string, format: uuid }
                enquiryId: { type: string, format: uuid }
                siteVisitId: { type: string, format: uuid }
                tenancyId: { type: string, format: uuid }
                rentalApplicationId: { type: string, format: uuid }
                rentalProposalId: { type: string, format: uuid }
                propertyId: { type: string, format: uuid }
                participantUserIds:
                  type: array
                  items: { type: string, format: uuid }
                message: { type: string }
      responses:
        '201': { description: Conversation created }
        '200': { description: Existing conversation reused }
        '403': { description: Not authorized for this context }
