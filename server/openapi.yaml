          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        total:
          type: integer
        nextCursor:
          type: string
          nullable: true
    CreateConversationRequest:
      type: object
      description: >
        Start (or reuse) a contextual conversation. Supply exactly one business
        context. When a conversation already exists for the same context
        (e.g. the same rentalApplicationId) between the same parties it is
        reused instead of duplicated. Authorization is derived from the context:
        applicants and property owners / assigned staff (property_manager,
        letting_agent) may participate; caretakers and unrelated users are
        denied.
      properties:
        type:
          type: string
          enum:
          - enquiry
          - site_visit
          - rental_application
          - rental_proposal
          - tenancy
          - maintenance
          - garbage_service
          - general
        subject:
          type: string
          nullable: true
        propertyId:
          type: string
          format: uuid
          nullable: true
        unitId:
          type: string
          format: uuid
          nullable: true
        enquiryId:
          type: string
          format: uuid
          nullable: true
        rentalApplicationId:
          type: string
          format: uuid
          nullable: true
          description: Rental application context; links and deduplicates the conversation per application.
        rentalProposalId:
          type: string
          format: uuid
          nullable: true
          description: Rental proposal context; links and deduplicates the conversation per proposal.
        siteVisitId:
          type: string
          format: uuid
          nullable: true
        tenancyId:
          type: string
          format: uuid
          nullable: true
        participantUserIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        message:
