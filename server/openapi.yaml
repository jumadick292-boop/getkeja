      - in: query
        name: latitude
        required: false
        schema:
          type: number
      - in: query
        name: longitude
        required: false
        schema:
          type: number
      - in: query
        name: county
        required: false
        schema:
          type: string
      - in: query
        name: city
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      responses:
        '200':
          description: Matching providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProviderDiscoveryResult'
