name: get_keja_mobile
description: "Find and rent homes, laundries, movers and garbage services across Kenya."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # State management
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8

  # Navigation
  go_router: ^18.1.4

  # HTTP
  dio: ^5.7.0

  # Secure storage
  flutter_secure_storage: ^11.2.0

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # QR code scanning and display
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0

  # Google Sign-In
  google_sign_in: ^7.2.0

  # Device info
  device_info_plus: ^13.3.0

  # Localization
  intl: ^0.20.3

  # Utilities
  equatable: ^3.0.0
  url_launcher: ^6.3.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  google_maps_flutter: ^2.19.0
  geolocator: ^14.1.2
  image_picker: ^1.2.4
  firebase_core: ^5.2.0
  file_picker: ^13.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.10
  freezed: ^4.0.3
  build_runner: ^2.4.13
  json_serializable: ^6.9.5

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/brand/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

# Test scripts. The API client requires a compile-time API_BASE_URL
# (Dart environment) because ApiConfig reads it via String.fromEnvironment.
# CI and local runs must supply it; the value below is a local dev URL,
# never a production URL.
scripts:
  test: "flutter test --dart-define=API_BASE_URL=http://127.0.0.1:4000"
  "test:coverage": "flutter test --coverage --dart-define=API_BASE_URL=http://127.0.0.1:4000"
